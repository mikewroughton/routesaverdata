name: Publish fuel prices

# Fuel Finder publishes price changes within 30 minutes, so refresh twice an hour.
# Minutes 7 and 37 avoid the busy top of the hour (GitHub can delay scheduled runs at :00).
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer run waits rather than cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test
        run: node --test scripts/feed.test.mjs

      # If this fails (API down, bad data, wrong secrets) nothing is deployed and the last good feed stays live.
      - name: Build feed from Fuel Finder
        run: node scripts/build-feed.mjs public
        env:
          FUEL_FINDER_CLIENT_ID: ${{ secrets.FUEL_FINDER_CLIENT_ID }}
          FUEL_FINDER_CLIENT_SECRET: ${{ secrets.FUEL_FINDER_CLIENT_SECRET }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
