name: Keep schedule alive

# GitHub turns off scheduled workflows in public repositories after 60 days with no repository activity.
# Publishing to Pages doesn't count, so commit a timestamp once a month.
on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Commit a timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "Keep scheduled publishing alive"
          git push
